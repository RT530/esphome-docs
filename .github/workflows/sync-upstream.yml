# Don't open a PR straight from this branch's fork to upstream - the sync commits
# would show up in the diff. Branch from upstream/next instead: see
# 'git fetch upstream next && git checkout -b my-fix upstream/next'.

name: Sync with upstream (esphome/esphome.io)

on:
  schedule:
    - cron: '0 0 * * *' # daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    # guards against this ever running as upstream's own workflow (e.g. if this file
    # were merged into esphome/esphome.io by any path) - it would otherwise try to add
    # itself as its own "upstream" remote and push to its own default branch
    if: github.repository != 'esphome/esphome.io'
    runs-on: ubuntu-latest
    steps:
      # GitHub does this merge server-side - the same operation as the "Sync fork"
      # button on the repo page. Because nothing is pushed over git, it is not
      # subject to the rule that refuses to let GITHUB_TOKEN create or update
      # files under .github/workflows/**. That rule is what failed every sync here
      # while upstream was editing its own workflows, and working around it is why
      # this step exists instead of a plain fetch/merge/push.
      - name: Sync fork via merge-upstream API
        id: sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          if gh api --method POST "/repos/$GITHUB_REPOSITORY/merge-upstream" \
               -f branch=next > merge.json; then
            jq -r '"\(.merge_type): \(.message)"' merge.json
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::merge-upstream API declined; falling back to git merge"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Only reached when the API refuses - in practice a genuine merge conflict
      # between the fork and upstream, which needs a real working tree to resolve.
      - name: Checkout fork
        if: steps.sync.outputs.ok != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: next
          # SYNC_TOKEN is a PAT carrying the `workflow` scope. Without it the
          # default GITHUB_TOKEN is used, which GitHub refuses to let push any
          # upstream commit that touches .github/workflows/**.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git identity
        if: steps.sync.outputs.ok != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        if: steps.sync.outputs.ok != 'true'
        run: |
          git remote add upstream https://github.com/esphome/esphome.io.git
          git fetch upstream next

      - name: Merge upstream/next into next
        if: steps.sync.outputs.ok != 'true'
        run: |
          git merge upstream/next --no-edit

      - name: Push
        if: steps.sync.outputs.ok != 'true'
        run: |
          if ! git push origin next; then
            echo "::error::Push failed. If the error mentions the workflows"
            echo "::error::permission, upstream changed a file under"
            echo "::error::.github/workflows/ and the default GITHUB_TOKEN cannot"
            echo "::error::push it. Add a PAT with the workflow scope as the"
            echo "::error::SYNC_TOKEN secret in this repository."
            exit 1
          fi
